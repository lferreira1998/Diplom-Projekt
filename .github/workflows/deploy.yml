name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/arizona-font-experiment

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm install @supabase/supabase-js

      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://lrppyiremhutnwtdhogt.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxycHB5aXJlbWh1dG53dGRob2d0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NjgyMjUsImV4cCI6MjA5MzA0NDIyNX0.hetcvdF-C2HpaqbuWcy16GcuGsRtsZ8CZzh7-EHfTX4

      - name: Add direct SPA route entrypoints
        run: |
          for route in \
            introduction \
            tool-collection \
            create-tool \
            my-tools \
            about-the-project \
            write \
            without-stopping \
            uninvited-thoughts \
            visible-corrections \
            blind-then-witness \
            off-the-grid \
            in-a-spiral \
            one-word-replay \
            drifting-following-words \
            drifting-disappearing-words \
            visual-timer \
            randomly-spatially
          do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          cname: shaping-thought.com
