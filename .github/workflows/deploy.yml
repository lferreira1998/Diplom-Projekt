name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/access-figma-code-fK8az
      - claude/clarify-session-scope-5R22z
      - claude/add-correction-page-RZqTR
      - claude/add-time-page-deploy-u33h3
      - claude/add-visibility-page-Ajf8Y
      - claude/fix-closing-animation-Pv4TW

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  codex-position-fixes:
    if: contains(github.event.head_commit.message, 'codex run position fixes')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/access-figma-code-fK8az
          fetch-depth: 2

      - name: Patch position fixes
        run: |
          node <<'JS'
          const fs = require('fs');

          const newPath = 'src/app/New.tsx';
          const wzPath = 'src/app/projects/parametrischestool/components/writing-zone.tsx';

          function mustReplace(text, from, to, label) {
            if (!text.includes(from)) throw new Error(`Missing pattern: ${label}`);
            return text.replace(from, to);
          }

          let wz = fs.readFileSync(wzPath, 'utf8');
          if (!wz.includes('FallingText')) {
            wz = mustReplace(
              wz,
              'import { createPortal } from "react-dom";\n',
              'import { createPortal } from "react-dom";\nimport { FallingText } from "../../offthegrid/components/FallingText";\n',
              'writing-zone import'
            );
          }
          if (!wz.includes('customLineMode?: boolean;')) {
            wz = mustReplace(
              wz,
              '  textAppearsRandom?: boolean;\n',
              '  textAppearsRandom?: boolean;\n  customLineMode?: boolean;\n',
              'customLineMode prop type'
            );
          }
          if (!wz.includes('customLineMode     = false')) {
            wz = mustReplace(
              wz,
              '  textAppearsRandom  = false,\n',
              '  textAppearsRandom  = false,\n  customLineMode     = false,\n',
              'customLineMode default'
            );
          }
          if (!wz.includes('if (customLineMode) {')) {
            const customBranch = `  if (customLineMode) {\n    return (\n      <div\n        className="flex-1 relative transition-all duration-300"\n        style={{ paddingRight: panelOpen ? "343px" : "0px", minHeight: "100vh" }}\n      >\n        <FallingText />\n      </div>\n    );\n  }\n\n`;
            wz = mustReplace(wz, '  if (textAppearsRandom) {\n', customBranch + '  if (textAppearsRandom) {\n', 'customLineMode render branch');
          }
          fs.writeFileSync(wzPath, wz);

          let src = fs.readFileSync(newPath, 'utf8');
          if (!src.includes('posStandard:')) {
            src = mustReplace(
              src,
              '    // Position\n    posSpiral: "Spiralförmiger Text",\n',
              '    // Position\n    posStandard: "Standard",\n    posSpiral: "Spiralförmiger Text",\n',
              'German posStandard translation'
            );
            src = mustReplace(
              src,
              '    // Position\n    posSpiral: "Spiraling Text",\n',
              '    // Position\n    posStandard: "Standard",\n    posSpiral: "Spiraling Text",\n',
              'English posStandard translation'
            );
          }

          src = src.replace(/"spiral" \| "random" \| "custom"/g, '"standard" | "spiral" | "random" | "custom"');
          src = src.replace(/useState<"standard" \| "spiral" \| "random" \| "custom">\("spiral"\)/g, 'useState<"standard" | "spiral" | "random" | "custom">("standard")');

          if (!src.includes('value: "standard" as const')) {
            src = mustReplace(
              src,
              '                    {([\n                      { value: "spiral" as const, label: t.posSpiral },\n',
              '                    {([\n                      { value: "standard" as const, label: t.posStandard },\n                      { value: "spiral" as const, label: t.posSpiral },\n',
              'Position standard option'
            );
          }

          if (!src.includes('customLineMode={positionMode === "custom"}')) {
            src = mustReplace(
              src,
              '          textAppearsRandom={positionMode === "random"}\n',
              '          textAppearsRandom={positionMode === "random"}\n          customLineMode={positionMode === "custom"}\n',
              'WritingZone customLineMode prop'
            );
          }
          fs.writeFileSync(newPath, src);
          JS

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm install @supabase/supabase-js

      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://lrppyiremhutnwtdhogt.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxycHB5aXJlbWh1dG53dGRob2d0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NjgyMjUsImV4cCI6MjA5MzA0NDIyNX0.hetcvdF-C2HpaqbuWcy16GcuGsRtsZ8CZzh7-EHfTX4

      - name: Commit source patch and restore workflow
        run: |
          git checkout HEAD^ -- .github/workflows/deploy.yml
          git config user.name "codex-cloud"
          git config user.email "codex-cloud@users.noreply.github.com"
          git add src/app/New.tsx src/app/projects/parametrischestool/components/writing-zone.tsx .github/workflows/deploy.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add standard and custom line position modes"
          git push origin HEAD:claude/access-figma-code-fK8az

  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm install @supabase/supabase-js

      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://lrppyiremhutnwtdhogt.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxycHB5aXJlbWh1dG53dGRob2d0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NjgyMjUsImV4cCI6MjA5MzA0NDIyNX0.hetcvdF-C2HpaqbuWcy16GcuGsRtsZ8CZzh7-EHfTX4

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: false
