            const langEffect = String.raw`
  useEffect(() => {
    const root = document.querySelector("[data-new-root]");
    if (!root) return;

    let queued = false;
    const applyLanguage = () => {
      queued = false;
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      const skipTags = new Set(["SCRIPT", "STYLE", "TEXTAREA"]);
      let node = walker.nextNode();
      while (node) {
        const parent = node.parentElement;
        if (parent && !skipTags.has(parent.tagName)) {
          const next = translateCopy(node.textContent ?? "", lang);
          if (next !== node.textContent) node.textContent = next;
        }
        node = walker.nextNode();
      }

      root.querySelectorAll<HTMLElement>("[placeholder], [title], [aria-label]").forEach((el) => {
        (["placeholder", "title", "aria-label"] as const).forEach((attr) => {
          const value = el.getAttribute(attr);
          if (!value) return;
          const next = translateCopy(value, lang);
          if (next !== value) el.setAttribute(attr, next);
        });
      });
    };

    applyLanguage();
    const observer = new MutationObserver(() => {
      if (queued) return;
      queued = true;
      window.requestAnimationFrame(applyLanguage);
    });
    observer.observe(root, {
      childList: true,
      subtree: true,
      characterData: true,
      attributes: true,
      attributeFilter: ["placeholder", "title", "aria-label"],
    });
    return () => observer.disconnect();
  }, [lang]);
`;
