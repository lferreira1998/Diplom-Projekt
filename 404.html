<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    var l = window.location;
    var basePath = l.pathname.split('/').slice(0, 2).join('/');
    var restPath = l.pathname.slice(1).split('/').slice(1).join('/');

    if (restPath === 'playgroundcodex' || restPath === 'playgroundcodex/my-tools') {
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        basePath + '/' + restPath + '/' + l.search + l.hash
      );
    } else {
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        basePath + '/?/' +
        restPath.replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    }
  </script>
</head>
<body></body>
</html>
