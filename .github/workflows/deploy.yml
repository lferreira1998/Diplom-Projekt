name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/access-figma-code-fK8az
      - claude/clarify-session-scope-5R22z
      - claude/add-correction-page-RZqTR
      - claude/add-time-page-deploy-u33h3
      - claude/add-visibility-page-Ajf8Y
      - claude/fix-closing-animation-Pv4TW

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  codex-position-fixes:
    if: contains(github.event.head_commit.message, 'codex apply position fixes')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/access-figma-code-fK8az
          fetch-depth: 2

      - name: Patch position fixes
        run: |
          node <<'JS'
          const fs = require('fs');

          const newPath = 'src/app/New.tsx';
          const wzPath = 'src/app/projects/parametrischestool/components/writing-zone.tsx';
          let changed = false;

          function writeIfChanged(path, next) {
            const prev = fs.readFileSync(path, 'utf8');
            if (prev !== next) {
              fs.writeFileSync(path, next);
              changed = true;
              console.log('patched', path);
            } else {
              console.log('unchanged', path);
            }
          }

          let wz = fs.readFileSync(wzPath, 'utf8');
          if (!wz.includes('projects/offthegrid/components/FallingText') && !wz.includes('../../offthegrid/components/FallingText')) {
            wz = wz.replace(
              'import { createPortal } from "react-dom";\n',
              'import { createPortal } from "react-dom";\nimport { FallingText } from "../../offthegrid/components/FallingText";\n'
            );
          }
          if (!wz.includes('customLineMode?: boolean;')) {
            wz = wz.replace(
              '  textAppearsRandom?: boolean;\n',
              '  textAppearsRandom?: boolean;\n  customLineMode?: boolean;\n'
            );
          }
          if (!wz.includes('customLineMode     = false')) {
            wz = wz.replace(
              '  textAppearsRandom  = false,\n',
              '  textAppearsRandom  = false,\n  customLineMode     = false,\n'
            );
          }
          if (!wz.includes('if (customLineMode) {')) {
            const customBranch = String.raw`
  if (customLineMode) {
    return (
      <div
        className="flex-1 relative transition-all duration-300"
        style={{ paddingRight: panelOpen ? "343px" : "0px", minHeight: "100vh" }}
      >
        <FallingText />
      </div>
    );
  }

`;
            wz = wz.replace('  if (textAppearsRandom) {\n', customBranch + '  if (textAppearsRandom) {\n');
          }
          writeIfChanged(wzPath, wz);

          let src = fs.readFileSync(newPath, 'utf8');
          if (!src.includes('posStandard:')) {
            src = src.replace(
              '    // Position\n    posSpiral: "Spiralförmiger Text",\n',
              '    // Position\n    posStandard: "Standard",\n    posSpiral: "Spiralförmiger Text",\n'
            );
            src = src.replace(
              '    // Position\n    posSpiral: "Spiraling Text",\n',
              '    // Position\n    posStandard: "Standard",\n    posSpiral: "Spiraling Text",\n'
            );
          }

          src = src.replace(/useState<"spiral" \| "random" \| "custom">\("spiral"\)/g, 'useState<"standard" | "spiral" | "random" | "custom">("standard")');
          src = src.replace(/useState<"standard" \| "spiral" \| "random" \| "custom">\("spiral"\)/g, 'useState<"standard" | "spiral" | "random" | "custom">("standard")');
          src = src.replace(/"spiral" \| "random" \| "custom"/g, '"standard" | "spiral" | "random" | "custom"');

          if (!src.includes('value: "standard" as const')) {
            src = src.replace(
              '                    {([\n                      { value: "spiral" as const, label: t.posSpiral },\n',
              '                    {([\n                      { value: "standard" as const, label: t.posStandard },\n                      { value: "spiral" as const, label: t.posSpiral },\n'
            );
            src = src.replace(
              '                    {([\n                      { value: "spiral" as const, label: "Spiraling Text" },\n',
              '                    {([\n                      { value: "standard" as const, label: t.posStandard },\n                      { value: "spiral" as const, label: "Spiraling Text" },\n'
            );
          }

          if (!src.includes('customLineMode={positionMode === "custom"}')) {
            src = src.replace(
              '          textAppearsRandom={positionMode === "random"}\n',
              '          textAppearsRandom={positionMode === "random"}\n          customLineMode={positionMode === "custom"}\n'
            );
          }

          writeIfChanged(newPath, src);

          if (!changed) {
            console.log('No source changes were needed');
          }
          JS

      - name: Restore deploy workflow immediately
        run: |
          git checkout HEAD^ -- .github/workflows/deploy.yml
          git config user.name "codex-cloud"
          git config user.email "codex-cloud@users.noreply.github.com"
          git add .github/workflows/deploy.yml
          if git diff --cached --quiet; then
            echo "Deploy workflow already restored"
          else
            git commit -m "Restore deploy workflow after position patch"
            git push origin HEAD:claude/access-figma-code-fK8az
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm install @supabase/supabase-js

      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://lrppyiremhutnwtdhogt.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6ImxycHB5aXJlbWh1dG53dGRob2d0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NjgyMjUsImV4cCI6MjA5MzA0NDIyNX0.hetcvdF-C2HpaqbuWcy16GcuGsRtsZ8CZzh7-EHfTX4

      - name: Commit source patch
        run: |
          git config user.name "codex-cloud"
          git config user.email "codex-cloud@users.noreply.github.com"
          git add src/app/New.tsx src/app/projects/parametrischestool/components/writing-zone.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Add standard and custom line position modes"
          git push origin HEAD:claude/access-figma-code-fK8az

  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm install @supabase/supabase-js

      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://lrppyiremhutnwtdhogt.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxycHB5aXJlbWh1dG53dGRob2d0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NjgyMjUsImV4cCI6MjA5MzA0NDIyNX0.hetcvdF-C2HpaqbuWcy16GcuGsRtsZ8CZzh7-EHfTX4

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: false
