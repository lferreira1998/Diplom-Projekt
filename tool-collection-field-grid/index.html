<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tool Collection Field Grid Prototype</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preload" href="/fonts/ABCArizona.woff" as="font" type="font/woff" crossorigin />
  <style>
    @font-face {
      font-family: "az-cond";
      src: url("/fonts/ABCArizona.woff") format("woff");
      font-weight: 200 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "az-sans";
      src: url("/fonts/ABCArizona.woff") format("woff");
      font-weight: 200 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --root-bg: #fcf6ef;
      --field-bg: #faf4ed;
      --ink: #302e2c;
      --text: #555555;
      --muted: #9a9daa;
      --line: #a4a4a4;
      --shadow: 4px 4px 12px rgba(0, 0, 0, 0.06);
      --fit-scale: 1;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--root-bg);
      color: var(--text);
      font-family: "az-sans", system-ui, sans-serif;
      font-variation-settings: "SRFF" 0, "wdth" 100, "wght" 360;
    }

    .viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: var(--root-bg);
    }

    .viewport.exploring {
      overflow: auto;
      cursor: grab;
      overscroll-behavior: contain;
    }

    .viewport.dragging {
      cursor: grabbing;
      user-select: none;
    }

    .frame {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1680px;
      height: 858px;
      transform: translate(-50%, -50%) scale(var(--fit-scale));
      transform-origin: center;
      overflow: hidden;
      background: var(--root-bg);
      transition: width 520ms ease, height 520ms ease, left 520ms ease, top 520ms ease, transform 520ms ease;
    }

    .surface {
      position: absolute;
      left: -516px;
      top: -740px;
      width: 2215px;
      height: 1556px;
      background: var(--field-bg);
      transition: left 520ms ease, top 520ms ease;
    }

    .viewport.exploring .frame {
      position: relative;
      left: 0;
      top: 0;
      width: 2215px;
      height: 1556px;
      transform: none;
      overflow: visible;
    }

    .viewport.exploring .surface {
      left: 0;
      top: 0;
    }

    .shape {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--w, 363px);
      height: var(--h);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      color: var(--text);
      background: var(--bg);
      border: 1px dashed var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      text-decoration: none;
      transform: rotate(var(--rot, 0deg));
      transform-origin: center;
      overflow: hidden;
    }

    .shape.off-grid {
      align-items: flex-end;
      justify-content: flex-start;
      padding: 12px;
    }

    .shape span {
      display: block;
      max-width: 100%;
      color: var(--text);
      font-family: "az-sans", system-ui, sans-serif;
      font-size: 17px;
      line-height: normal;
      font-weight: 400;
      letter-spacing: 0;
      text-align: center;
      white-space: nowrap;
      word-break: break-word;
      font-variation-settings: "SRFF" 0, "wdth" 100, "wght" 360;
    }

    .shape.off-grid span { text-align: left; }

    .hero-copy {
      position: absolute;
      left: 971px;
      top: 1062px;
      width: 768px;
      color: var(--ink);
      text-align: center;
      transition: opacity 260ms ease;
      z-index: 4;
    }

    .hero-copy h1 {
      margin: 0;
      color: var(--ink);
      font-family: "az-cond", Georgia, serif;
      font-size: 34px;
      line-height: 42px;
      font-weight: 400;
      letter-spacing: 0;
      white-space: nowrap;
      font-variation-settings: "SRFF" 70, "wdth" 80, "wght" 360;
    }

    .actions {
      position: absolute;
      left: 1183.5px;
      top: 1174px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      z-index: 5;
      transition: opacity 260ms ease;
    }

    .viewport.exploring .hero-copy,
    .viewport.exploring .actions {
      opacity: 0;
      pointer-events: none;
    }

    button,
    .button {
      border-radius: 4px;
      padding: 12px 24px;
      font-family: "az-sans", system-ui, sans-serif;
      font-size: 17px;
      line-height: normal;
      font-weight: 300;
      letter-spacing: -0.17px;
      white-space: nowrap;
      cursor: pointer;
      text-decoration: none;
      font-variation-settings: "SRFF" 0, "wdth" 100, "wght" 300;
    }

    .primary {
      border: 1px solid #242424;
      background: #242424;
      color: #fffbf7;
    }

    .secondary {
      border: 1px dashed var(--line);
      background: #ffffff;
      color: #242424;
    }

    .back-field,
    .hint {
      position: fixed;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
      background: rgba(252, 246, 239, 0.74);
      backdrop-filter: blur(6px);
      color: var(--text);
      border: 1px dashed var(--line);
    }

    .back-field {
      left: 28px;
      top: 28px;
      padding: 10px 14px;
      font-size: 14px;
      letter-spacing: 0;
    }

    .hint {
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      border-radius: 100px;
      padding: 9px 15px;
      color: var(--muted);
      font-size: 13px;
    }

    .viewport.exploring + .back-field,
    .viewport.exploring ~ .hint {
      opacity: 1;
      pointer-events: auto;
    }

    @media (max-width: 760px) {
      .frame {
        width: 1680px;
        height: 858px;
      }
      .back-field { left: 14px; top: 14px; }
      .hint { bottom: 14px; }
    }
  </style>
</head>
<body>
  <main id="viewport" class="viewport" aria-label="Tool collection field grid prototype">
    <section id="frame" class="frame" aria-label="Writing tools field">
      <div id="surface" class="surface">
        <div class="hero-copy">
          <h1>
            Writing Tools shape how we think &amp; write.<br />
            Explore Writing Tools that break their rules.
          </h1>
        </div>
        <div class="actions">
          <button id="explore" class="primary" type="button">Explore All Tools</button>
          <a class="button secondary" href="/create-tool">Create Your Tool</a>
        </div>
      </div>
    </section>
  </main>

  <button id="back" class="back-field" type="button">Back to start</button>
  <div class="hint">drag or scroll the field in every direction</div>

  <script>
    const viewport = document.getElementById("viewport");
    const frame = document.getElementById("frame");
    const surface = document.getElementById("surface");
    const exploreButton = document.getElementById("explore");
    const backButton = document.getElementById("back");

    const colors = {
      spiral: "#eef7ff",
      visible: "#f6f8ed",
      blind: "#ecfaf0",
      off: "#fff4f6",
      without: "#fef8ee"
    };

    const presets = {
      spiral: { label: "...in a spiral", href: "/create-tool?preset=in-a-spiral", bg: colors.spiral, h: 120, r: "200px" },
      visible: { label: "...with visible corrections", href: "/create-tool?preset=visible-corrections", bg: colors.visible, h: 174, r: "40px 4px 40px 4px" },
      blind: { label: "...blind & then witness", href: "/create-tool?preset=blind-then-witness", bg: colors.blind, h: 190, r: "100px" },
      off: { label: "...off the grid", href: "/create-tool?preset=off-the-grid", bg: colors.off, h: 235, r: "4px", cls: "off-grid" },
      without: { label: "...without stopping", href: "/create-tool?preset=without-stopping", bg: colors.without, h: 359.05, r: "200px" }
    };

    const col = [0, 463, 926, 1389, 1852];
    const shapes = [
      [0, 0, "spiral"], [0, 220, "visible"], [0, 494, "blind"], [0, 784, "off"], [0, 1119, "without"],
      [1, 0, "visible"], [1, 274, "off"], [1, 609, "spiral"], [1, 839.57, "blind", 3.39], [1, 1140.13, "without"],
      [2, 0, "visible"], [2, 274, "blind"], [2, 564, "without"], [2, 1339.1, "blind", -4.37],
      [3, 0, "visible"], [3, 274, "blind"], [3, 564, "blind"], [3, 830.77, "spiral", -3.91], [3, 1351.19, "visible", 2.17],
      [4, 0, "off"], [4, 335, "blind"], [4, 625, "without"], [4, 1084.05, "visible", 4.75], [4, 1387.54, "spiral"]
    ];

    function addShape(entry) {
      const [column, y, type, rotate = 0] = entry;
      const preset = presets[type];
      const shape = document.createElement("a");
      shape.className = `shape ${preset.cls || ""}`;
      shape.href = preset.href;
      shape.style.setProperty("--x", `${col[column]}px`);
      shape.style.setProperty("--y", `${y}px`);
      shape.style.setProperty("--w", "363px");
      shape.style.setProperty("--h", `${preset.h}px`);
      shape.style.setProperty("--r", preset.r);
      shape.style.setProperty("--bg", preset.bg);
      shape.style.setProperty("--rot", `${rotate}deg`);
      shape.innerHTML = `<span>${preset.label}</span>`;
      surface.insertBefore(shape, surface.firstChild);
    }

    shapes.forEach(addShape);

    function fitFrame() {
      const scale = Math.min(window.innerWidth / 1680, window.innerHeight / 858);
      document.documentElement.style.setProperty("--fit-scale", String(scale));
    }

    fitFrame();
    window.addEventListener("resize", fitFrame);

    function centerField() {
      viewport.scrollTo({
        left: Math.max(0, (frame.offsetWidth - viewport.clientWidth) / 2),
        top: Math.max(0, (frame.offsetHeight - viewport.clientHeight) / 2),
        behavior: "smooth"
      });
    }

    exploreButton.addEventListener("click", () => {
      viewport.classList.add("exploring");
      window.setTimeout(centerField, 120);
    });

    backButton.addEventListener("click", () => {
      viewport.classList.remove("exploring", "dragging");
      viewport.scrollTo({ left: 0, top: 0, behavior: "smooth" });
    });

    let dragging = false;
    let startX = 0;
    let startY = 0;
    let scrollX = 0;
    let scrollY = 0;

    viewport.addEventListener("pointerdown", (event) => {
      if (!viewport.classList.contains("exploring")) return;
      if (event.target.closest("a, button")) return;
      dragging = true;
      startX = event.clientX;
      startY = event.clientY;
      scrollX = viewport.scrollLeft;
      scrollY = viewport.scrollTop;
      viewport.classList.add("dragging");
      viewport.setPointerCapture(event.pointerId);
    });

    viewport.addEventListener("pointermove", (event) => {
      if (!dragging) return;
      viewport.scrollLeft = scrollX - (event.clientX - startX);
      viewport.scrollTop = scrollY - (event.clientY - startY);
    });

    function stopDragging() {
      dragging = false;
      viewport.classList.remove("dragging");
    }

    viewport.addEventListener("pointerup", stopDragging);
    viewport.addEventListener("pointercancel", stopDragging);
  </script>
</body>
</html>
