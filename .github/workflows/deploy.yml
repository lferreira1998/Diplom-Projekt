const normalizeCopy = (value: string) => value.trim().replace(/\s+/g, " ");

const COPY_MAPS: Record<Lang, Map<string, string>> = {
  de: new Map(COPY_PAIRS.flatMap(({ de, en }) => [[normalizeCopy(de), de], [normalizeCopy(en), de]])),
  en: new Map(COPY_PAIRS.flatMap(({ de, en }) => [[normalizeCopy(de), en], [normalizeCopy(en), en]])),
};

function translateCopy(value: string, lang: Lang) {
  const normalized = normalizeCopy(value);
  let next = COPY_MAPS[lang].get(normalized);
  if (!next) {
    const afterMatch = normalized.match(/^After (\d+) min$/);
    const nachMatch = normalized.match(/^Nach (\d+) min$/);
    if (lang === "de" && afterMatch) next = `Nach ${afterMatch[1]} min`;
    if (lang === "en" && nachMatch) next = `After ${nachMatch[1]} min`;
  }
  if (!next) return value;
  const leading = value.match(/^\s*/)?.[0] ?? "";
  const trailing = value.match(/\s*$/)?.[0] ?? "";
  return `${leading}${next}${trailing}`;
}
`;
            const marker = '// ── Component';
            const idx = src.indexOf(marker);
