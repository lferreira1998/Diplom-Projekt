      <style>
        @font-face {

          src: url('/fonts/ABCArizona.woff') format('woff');
          font-weight: 200 700;
          font-style: normal oblique -14deg 0deg;
        }
        /* Override all existing font families to use ABCArizona */
        @font-face {
          font-family: 'freight-text-pro';
          src: url('/fonts/ABCArizona.woff') format('woff');
          font-weight: 200 700;
          font-style: normal oblique -14deg 0deg;
        }
        @font-face {
          font-family: 'freighttextcmp-pro';
          src: url('/fonts/ABCArizona.woff') format('woff');

        @font-face {
          font-family: 'general-sans';
          src: url('/fonts/ABCArizona.woff') format('woff');
          font-weight: 200 700;
          font-style: normal;
        }
        /* Apply correct variation axes per font role via inline style attribute selectors */
        [style*="freight-text-pro"] {
          font-variation-settings: 'SRFF' 100, 'wdth' 100 !important;
        }
        [style*="freighttextcmp-pro"] {
          font-variation-settings: 'SRFF' 100, 'wdth' 70 !important;
        }
        [style*="general-sans"] {
          font-variation-settings: 'SRFF' 0, 'wdth' 100 !important;
